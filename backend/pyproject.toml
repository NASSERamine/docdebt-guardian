[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docdebt-guardian"
version = "0.1.0"
description = "Detect and repair stale method-level Javadoc (documentation debt) in Java code."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tree-sitter>=0.23,<0.26",  # 0.26.0 segfaults on this workload (see README)
    "tree-sitter-java>=0.23",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "langchain-core>=1.0",
    "langchain-ollama>=1.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
]

[project.optional-dependencies]
service = ["fastapi>=0.110", "uvicorn[standard]>=0.30", "httpx>=0.27", "pyjwt>=2.7", "cryptography>=42"]
openai = ["langchain-openai>=1.0"]
anthropic = ["langchain-anthropic>=1.0"]
google = ["langchain-google-genai>=2.0"]
context = ["sentence-transformers>=3.0", "numpy>=1.26"]
bench = ["pandas>=2.2", "openpyxl>=3.1"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "javalang>=0.13"]

[project.scripts]
docdebt = "docdebt.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docdebt = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 115
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer declares CLI options through default values: this is the library's idiom.
"src/docdebt/cli.py" = ["B008"]
# FastAPI declares dependencies through default values (Depends): same idiom.
"src/docdebt/service/app.py" = ["B008"]
# Verbatim copy of the validated research wordings: never reformatted.
"src/docdebt/llm/prompts/detection_wordings.py" = ["E501", "UP035"]

[tool.ruff.format]
exclude = ["src/docdebt/llm/prompts/detection_wordings.py"]
